<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>StudyTube Filter</title>
  <style>
    body { font-family: system-ui, -apple-system, "Hiragino Sans", sans-serif; padding: 12px; width: 320px; }
    label { display:block; font-size: 12px; opacity:.8; margin-top: 10px; }
    input, button, textarea { width: 100%; font: inherit; box-sizing: border-box; }
    input { padding: 8px 10px; border-radius: 10px; border: 1px solid rgba(0,0,0,.15); }
    button { margin-top: 10px; padding: 9px 10px; border-radius: 10px; border: 1px solid rgba(0,0,0,.15); cursor: pointer; background: #111; color:#fff; }
    .row { display:flex; gap: 8px; }
    .muted { font-size: 12px; opacity: .75; line-height: 1.4; }
    pre { background: #111; color: #eee; padding: 10px; border-radius: 10px; overflow: auto; max-height: 160px; }
    .ok { color: #0a0; }
    .ng { color: #c00; }
  </style>
</head>
<body>
  <h3 style="margin:0 0 6px;">StudyTube Filter</h3>
  <div class="muted">学習テーマに関連するタイトルだけ表示します（YouTubeはSPAなので自動で追従）。</div>

  <label>OpenAI API Key（個人利用）</label>
  <input id="apiKey" type="password" placeholder="sk-..." />

  <label>学習テーマ</label>
  <input id="theme" type="text" placeholder="例：生成AI" />

  <div class="row">
    <button id="apply">適用（キーワード生成）</button>
  </div>

  <div id="status" class="muted" style="margin-top:10px;"></div>

  <label>allowedKeywords（保存値）</label>
  <pre id="keywords">(未設定)</pre>

  <script src="popup.js"></script>
</body>
</html>
